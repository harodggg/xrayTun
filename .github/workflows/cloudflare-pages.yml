name: Cloudflare Pages

# 把 `site/` 部署到 Cloudflare Pages（canonical 站点 `https://xraytun.top`）。
#
# 与 `pages.yml`（GitHub Pages）的关系：
#   * Cloudflare Pages = **canonical**（自定义域 xraytun.top）；
#   * GitHub Pages     = **镜像/回退**（harodggg.github.io/xrayTun），保留；
#   * 两个域名同时可访问时必须保证 canonical 唯一（由 `site/` 自己声明）。
#
# # 本工作流的原则：**读回验证，而不是「调用没报错」**
#
# 踩过的两次坑，别再犯：
#   1. 绑了自定义域但 **zone 里没有对应 DNS 记录** —— CF 不一定会自动创建。
#      只报「绑定成功」的话域名根本解析不了。所以绑完必须 `GET /dns_records`
#      读回确认，缺了自己建（幂等）。
#   2. `PATCH /settings/always_use_https` 在 token 缺 `Zone → Zone Settings → Edit`
#      时会返回 `Authentication error`。若只打印「已开启」就是假成功。
#      所以必须 **PATCH 之后 GET 读回**，按读到的 `value` 如实报告。
#
# 凭据**只通过 GitHub Secrets 注入**：
#   CLOUDFLARE_API_TOKEN   —— Account → Cloudflare Pages → Edit（建项目/部署/绑域）
#                             + Zone → DNS → Edit（补 CNAME）
#                             + Zone → Zone Settings → Edit（才能远程开 Always Use HTTPS）
#   CLOUDFLARE_ACCOUNT_ID
# **不要把 token 写进这里、也不要 echo 出来。**
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个部署；不取消进行中的（避免半发布状态）
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  CF_PROJECT: xraytun
  CF_ZONE_ID: d5c9855127ff057a8f2c640f51024663 # xraytun.top 的 zone（不是密钥）

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4

      - name: 站点静态检查（必需文件 + 相对路径）
        run: |
          set -eu
          fail=0
          for f in index.html en/index.html llms.txt llms-full.txt robots.txt sitemap.xml \
                   assets/site.css assets/site.js; do
            [ -e "site/$f" ] && echo "  ✓ site/$f" || { echo "  ✗ 缺 site/$f" >&2; fail=1; }
          done
          if grep -rInE '(href|src)="/([^/]|$)' site --include='*.html' >/tmp/abs.txt; then
            echo "  ✗ 发现根绝对路径（GH Pages 镜像上会 404）：" >&2; cat /tmp/abs.txt >&2; fail=1
          else
            echo "  ✓ 没有根绝对路径"
          fi
          # 相关项目页必须留在「发现入口」里：v0.8.38 的发版提交手工重写了
          # sitemap.xml / llms.txt / llms-full.txt，把「信息过滤器 · Jev」整段静默删掉过。
          for f in sitemap.xml llms.txt llms-full.txt; do
            grep -q 'jev-x-filter/' "site/$f" \
              && echo "  ✓ site/$f 收录了 /jev-x-filter/" \
              || { echo "  ✗ site/$f 缺少 /jev-x-filter/ 收录（发版重写时容易漏）" >&2; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      - name: 确保 Pages 项目存在（读回确认；建不了就给出可操作提示）
        run: |
          set -eu
          auth="Authorization: Bearer $CF_TOKEN"
          listing=$(curl -sS -H "$auth" "$API/accounts/$CF_ACCOUNT_ID/pages/projects?per_page=100")
          found=$(echo "$listing" | jq -r --arg p "$CF_PROJECT" 'if any(.result[]?; .name == $p) then "yes" else "no" end')
          if [ "$found" = "yes" ]; then
            echo "  · 项目 $CF_PROJECT 已存在"
            exit 0
          fi
          # 列不出来时把原始响应打出来，别把「列不出来」和「不存在」混为一谈
          echo "  · 列表里没有 $CF_PROJECT（原始响应前 300 字符）：$(echo "$listing" | head -c 300)"
          echo "  · 尝试创建…"
          out=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" \
            "$API/accounts/$CF_ACCOUNT_ID/pages/projects" \
            -d "{\"name\":\"$CF_PROJECT\",\"production_branch\":\"main\"}")
          if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
            echo "  ✓ 已创建项目"
            exit 0
          fi
          # **幂等**：已经有了就算成功（8000002 = already exists）。
          # 上一版没处理这一条，于是「项目其实存在但列表没读到」直接把工作流判失败。
          if [ "$(echo "$out" | jq -r '[.errors[]?.code] | index(8000002) != null')" = "true" ]; then
            echo "  · 项目已存在（8000002），按成功处理"
            exit 0
          fi
          echo "  ✗ 创建项目失败：$(echo "$out" | jq -c '.errors')"
          echo "  → token 需要 Account → Cloudflare Pages → Edit；否则只能读、不能建。" >&2
          exit 1

      - name: 部署 site/ 到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` 会让这次部署成为 **production** 部署（而不是 preview）
          command: pages deploy site --project-name=${{ env.CF_PROJECT }} --branch=main

      - name: 绑定自定义域 + 补 DNS + 开 Always Use HTTPS（全部读回验证）
        run: |
          set -eu
          auth="Authorization: Bearer $CF_TOKEN"
          DOMAINS="$API/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains"

          echo "== 1) 绑定 apex 与 www（幂等）=="
          existing=$(curl -sS -H "$auth" "$DOMAINS" | jq -r '[.result[]?.name] | join(" ")')
          echo "  已绑定：${existing:-（无）}"
          for d in xraytun.top www.xraytun.top; do
            case " $existing " in
              *" $d "*) echo "  · $d 已绑定，跳过" ;;
              *)
                out=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" "$DOMAINS" -d "{\"name\":\"$d\"}")
                if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
                  echo "  ✓ 已绑定 $d"
                else
                  echo "  ✗ 绑定 $d 失败：$(echo "$out" | jq -c '.errors')"
                fi
                ;;
            esac
          done

          echo "== 2) 自定义域状态（读回）=="
          curl -sS -H "$auth" "$DOMAINS" \
            | jq -r '.result[]? | "  · \(.name): status=\(.status) validation=\(.validation_data.status // "-")"'

          echo "== 3) DNS（读回；缺则创建）=="
          target="$CF_PROJECT.pages.dev"
          for rec in xraytun.top www.xraytun.top; do
            got=$(curl -sS -H "$auth" "$API/zones/$CF_ZONE_ID/dns_records?type=CNAME&name=$rec" | jq -r '.result[0].content // ""')
            if [ -n "$got" ]; then
              echo "  · $rec 已存在 → $got"
            else
              echo "  · $rec 缺记录，创建 CNAME → $target"
              out=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" \
                "$API/zones/$CF_ZONE_ID/dns_records" \
                -d "{\"type\":\"CNAME\",\"name\":\"$rec\",\"content\":\"$target\",\"proxied\":true,\"ttl\":1}")
              if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
                echo "  ✓ 已创建"
              else
                echo "  ✗ 创建失败：$(echo "$out" | jq -c '.errors')"
              fi
              got=$(curl -sS -H "$auth" "$API/zones/$CF_ZONE_ID/dns_records?type=CNAME&name=$rec" | jq -r '.result[0].content // ""')
              echo "    读回：${got:-（仍为空）}"
            fi
          done

          echo "== 4) Always Use HTTPS（PATCH 后读回 value）=="
          curl -sS -o /dev/null -X PATCH -H "$auth" -H "Content-Type: application/json" \
            "$API/zones/$CF_ZONE_ID/settings/always_use_https" -d '{"value":"on"}' || true
          val=$(curl -sS -H "$auth" "$API/zones/$CF_ZONE_ID/settings/always_use_https" \
            | jq -r 'if .success then (.result.value // "unknown") else ("ERR:" + (.errors|tostring)) end')
          if [ "$val" = "on" ]; then
            echo "  ✓ 已开启（读回 value=on）"
          else
            echo "  ✗ **未开启**（读回 value=$val）"
            echo "    token 缺 Zone → Zone Settings → Edit，或该 zone 不允许远程改此设置；"
            echo "    需要用户到控制台 SSL/TLS → Edge Certificates 手动打开。**此处如实记为未完成。**"
          fi
