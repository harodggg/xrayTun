[package]
name = "xraytun-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "XrayTun 桌面端（Tauri 2 外壳）"
default-run = "xraytun-desktop"

[lib]
name = "xraytun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
xt-proto.workspace = true
xt-core.workspace = true
xt-tun.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

# 登录项（SMAppService）。objc2 本来就在 Tauri 的依赖树里，
# 这里只是把它变成直接依赖，用消息发送调 ServiceManagement 框架 ——
# 那个框架没有 Rust 绑定。
objc2 = "0.6"

libc.workspace = true
url.workspace = true
