name: Release

# 打 tag 即发布：
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 为什么发版要放在 CI 而不是本地跑 `scripts/package-macos.sh`：
#
# 1. **universal 包**。本机是 Homebrew 装的 rust，它没有 rustup、加不了
#    target，所以本地只能出主机架构的包（实测：x86_64 的 App + arm64 的核心）。
#    runner 上的 rustup 能同时装两个 target，出一个真正的通用包。
# 2. **核心也要 universal**。上游按架构分发，得分别下载再用 lipo 合成 ——
#    这一步只有 CI 做才不依赖「我这台机器是什么架构」。
# 3. 发布动作需要 `contents: write` 令牌，CI 自带，本地没有。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.0）"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ github.workspace }}/.cargo
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
  # 见 ci.yml 里的说明：check.sh 的默认值在仓库隔壁，而 actions/cache
  # 缓存的是工作区里面的 `.npm-cache`，必须显式对齐。
  npm_config_cache: ${{ github.workspace }}/.npm-cache
  # **发行版的第二道门**（安全审计 P0-1 / F1）在下面「预检 XRAYTUN_TEAM_ID 注入」那一步里
  # 统一归一化后写进 `$GITHUB_ENV`。这里**故意不**在 workflow 层设 `XRAYTUN_TEAM_ID`：
  # 同名同时出现在 workflow env 与 `$GITHUB_ENV` 会引入"谁优先"的歧义，而这一步的
  # 全部意义就是把值变成**非空且唯一**。完整判据与哨兵见 `scripts/team-id.sh`（单一来源）。

jobs:
  release:
    name: 构建并发布 universal 包
    # macos-14 是 Apple Silicon。包是 universal 的，所以用哪个架构的 runner
    # 都行，选 arm64 只是因为它更快。
    runs-on: macos-14
    steps:
      # `fetch-depth: 0` 是**必需的**，不是优化：下面的 `scripts/check.sh` 会跑
      # `scripts/bump-release.py self-test`，夹具是**真实历史树**（`git archive <commit>`）。
      # 默认 `--depth 1` 取不到那个提交 ⇒ 自测以退出码 75（环境问题）失败，发版会被拦下。
      # 打 tag 发布时 checkout 的是 tag 的树，历史里**包含**夹具提交（它是本 tag 的祖先）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------- Team ID 预检
      #
      # 为什么排在最前面（早于任何编译）：缺注入的构建**必须走不到出包**。
      # 判据在 `scripts/team-id.sh`（单一来源）：真实 Team ID / 显式哨兵（fail closed）
      # 二选一；未设或空串一律失败。归一化后的值写进 `$GITHUB_ENV`，后续所有步骤
      # （check.sh、package-macos.sh、产物断言）拿到的都是**非空**值 —— 这一步也顺手堵住
      # 了"`${{ vars.X }}` 未定义 ⇒ 空串 ⇒ peer.rs 反而开门"这个最阴的形态。
      #
      # 输入用**另一个变量名**（`..._INPUT`）传进来：`$GITHUB_ENV` 与 workflow env 同名时
      # 谁优先是个容易记错的细节，这里不让它成为判据的一部分。
      - name: 预检 XRAYTUN_TEAM_ID 注入（发行版 helper 的第二道门）
        env:
          XRAYTUN_TEAM_ID_INPUT: ${{ vars.XRAYTUN_TEAM_ID }}
        run: |
          set -eu
          # shellcheck source=./scripts/team-id.sh
          source scripts/team-id.sh
          XRAYTUN_TEAM_ID="${XRAYTUN_TEAM_ID_INPUT-}" team_id_resolve --into "$GITHUB_ENV"
          # 自证：写进 GITHUB_ENV 的值必须非空（空串会让 helper 退化成 InsecureAllowAny）
          grep -q '^XRAYTUN_TEAM_ID=.' "$GITHUB_ENV" || {
            echo "✗ 归一化后的 XRAYTUN_TEAM_ID 为空 —— 拒绝继续" >&2; exit 1; }
          grep -q '^XRAYTUN_TEAM_ID=.' "$GITHUB_ENV" &&
            echo "已注入 XRAYTUN_TEAM_ID（非空；值本身不打印）"

      - name: 安装 Rust 与两个 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          rustup target list --installed

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            .cargo/git
            .cargo-target
          key: ${{ runner.os }}-universal-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-universal-cargo-

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: 分别取两种架构的核心并合成 universal
        run: |
          set -eu
          # 交叉架构那份本机执行不了，用 XRAY_SKIP_VERSION_CHECK 跳过校验；
          # 合成之后统一验一次。
          XRAY_ARCH=arm64  XRAY_SKIP_VERSION_CHECK=1 XRAY_DEST="$PWD/bins/arm64"  ./scripts/fetch-xray.sh
          XRAY_ARCH=x86_64 XRAY_SKIP_VERSION_CHECK=1 XRAY_DEST="$PWD/bins/x86_64" ./scripts/fetch-xray.sh

          mkdir -p apps/desktop/binaries
          lipo -create bins/arm64/xray bins/x86_64/xray -output apps/desktop/binaries/xray
          chmod +x apps/desktop/binaries/xray

          # geo 数据两份是一样的，取其一即可。
          cp bins/arm64/geoip.dat bins/arm64/geosite.dat apps/desktop/binaries/
          cp bins/arm64/LICENSE-xray apps/desktop/binaries/ 2>/dev/null || true

          echo "核心架构：$(lipo -archs apps/desktop/binaries/xray)"
          # 到这里核心一定能在本机执行（含本机架构的 slice），
          # 所以版本下限校验放在这里做。
          apps/desktop/binaries/xray version | head -1

      - name: 前端依赖
        run: npm --prefix apps/ui ci --no-audit --no-fund --cache "$GITHUB_WORKSPACE/.npm-cache"

      - name: 测试（发版前必须全绿，与本地同一套）
        # 和 ci.yml 调用同一个脚本，避免两边漂移。
        # 跳过它最后那次 release 构建：下面 `package-macos.sh` 会用真正的
        # universal target 再编一次，那才是这个包真正要走通的路径。
        run: ./scripts/check.sh --no-release-build

      - name: 打包（universal）
        env:
          XRAYTUN_TARGET: universal-apple-darwin
        run: ./scripts/package-macos.sh

      - name: 校验产物确实是 universal，且是自洽的
        run: |
          set -eu
          D="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle"
          APP="$D/macos/XrayTun.app"
          echo "App : $(lipo -archs "$APP/Contents/MacOS/xraytun-desktop")"
          echo "核心: $(lipo -archs "$APP/Contents/Resources/xray")"
          echo "helper: $(lipo -archs "$APP/Contents/MacOS/xraytun-helper")"

          for f in Contents/MacOS/xraytun-desktop Contents/MacOS/xraytun-helper \
                   Contents/Resources/xray Contents/Resources/geoip.dat \
                   Contents/Resources/geosite.dat; do
            [ -e "$APP/$f" ] || { echo "缺少 $f" >&2; exit 1; }
          done

          # 三个可执行文件都必须是 universal，否则这个包就名不副实。
          for f in Contents/MacOS/xraytun-desktop Contents/MacOS/xraytun-helper \
                   Contents/Resources/xray; do
            archs="$(lipo -archs "$APP/$f")"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "$f 不是 universal（$archs）" >&2; exit 1 ;;
            esac
          done

          # **必须带 --strict。**
          #
          # 非严格的 `codesign --verify` 会放过带 `com.apple.FinderInfo` 的二进制：
          # v0.8.26 的产物里 App 的 13 个文件（含 `Contents/MacOS/xraytun-helper`
          # 与 `xraytun-desktop`）全都带着它，而这一行用的是非严格校验 →
          # 一直显示成功。实测：
          #   codesign --verify --verbose=1  → exit 0
          #   codesign --verify --strict     → exit 1
          #     "resource fork, Finder information, or similar detritus not allowed"
          #     "Disallowed xattr com.apple.FinderInfo found on .../xraytun-helper"
          # 现在它不阻塞启动，但**公证与 Developer ID 分发必然被挡住**。
          # 清 xattr 的动作在 `scripts/package-macos.sh` 签名之前（逐文件，见该脚本）。
          codesign --verify --strict --verbose=1 "$APP"

          # **发行版的第二道门必须是编进去的**（安全审计 P0-1 / F1）。
          #
          # 为什么单列一步：F1 的形态就是"配置看着有、产物其实是空的"。`package-macos.sh`
          # 里也断言了一次（同一个脚本、同一个判据），这里再对**最终 .app 里那份 helper**
          # 断言一次，让它在 CI 上有一个独立的、可见的判据：
          #   `peer.rs` 只在 `option_env!("XRAYTUN_TEAM_ID")` 为 None/空串时才退化成
          #   `InsecureAllowAny`；注入值是编译期字面量，必然落在二进制里 ⇒ 找到它 =
          #   这一版走的是 `RequireSignature`。
          # 注意断言的是 **产物**，不是"环境变量还在不在"——后者证明不了这一版编进了什么。
          echo "== 断言 helper 产物带着注入的 Team ID（值本身不打印）=="
          ./scripts/verify-team-id-injection.sh \
            --assert-helper "$APP/Contents/MacOS/xraytun-helper" --expect "$XRAYTUN_TEAM_ID"

      - name: 收集产物
        id: collect
        run: |
          set -eu
          D="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/dmg"
          mkdir -p dist
          # **按版本挑，别用 `cp *.dmg *.zip` 一把捞。**
          #
          # CI 缓存了 .cargo-target，而打包产物目录会跟着跨版本存活 ——
          # 一把捞会把上一版的包也带进这一版的 Release（实测 v0.7.8 里就混着
          # 0.7.7 的 dmg/zip，而更新器可能下到那个旧的）。
          VER="$(python3 -c "import json;print(json.load(open('apps/desktop/tauri.conf.json'))['version'])")"
          echo "本次版本：$VER"
          cp "$D"/XrayTun_${VER}_*.dmg "$D"/XrayTun_${VER}_*.zip dist/
          # 断言正好两个：多了说明捞进了别的版本，少了说明这一版没打出来。
          n=$(ls dist/*.dmg dist/*.zip 2>/dev/null | wc -l | tr -d ' ')
          [ "$n" = "2" ] || { echo "预期 2 个产物，实际 $n 个：" >&2; ls -l dist/ >&2; exit 1; }
          # 校验和：下载的人至少能自己核对一下完整性。
          (cd dist && shasum -a 256 ./* > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          # Release 正文 = 本版「用户动作」+ 固定模板（安装说明等）。
          #
          # 动作的**单一来源**是 docs/release-notes/<tag>.md（每个 tag 一份）：
          #   · 为什么不用 CHANGELOG 的固定小节：那要新增一套「从 Markdown 里切出小节」的
          #     解析（标题层级/先后顺序都会成为新的脆弱点），而这里只要一个**路径由 tag 派生**的
          #     文件 —— 存在性检查是 `test -f`，没有解析；
          #   · 为什么动作不能藏在通用模板里：v0.8.35 需要「**重新**安装特权助手」，而模板里
          #     只有通用的「点安装 helper」⇒ 那一版只能发布后手工 `gh release edit` 补，
          #     这正是本条要消灭的「靠纪律」。判据写在 scripts/bump-release.py 的 notes 子命令里：
          #     **动作文件缺 / 空 / 既没有 Markdown 标题也没有「本版无需用户额外动作」这句 ⇒ 失败**，
          #     不许静默退化成通用模板。
          #   · 为什么合成逻辑在脚本里而不在这个 YAML 里：heredoc 没法单测；脚本可以用
          #     `--tag v<假版本>` 在本地演练（见 docs/verification/verify-release-notes-step.sh）。
          python3 scripts/bump-release.py notes --tag "$TAG" --out NOTES.md
          test -s NOTES.md || { echo "✗ NOTES.md 为空" >&2; exit 1; }

          # 先建 Release（不带资产），再**逐个**上传。
          #
          # 为什么不用 `gh release create dist/*` 一把梭：45MB 的 dmg 走 GitHub
          # 的上传端点，偶发 `connection reset by peer` 很正常。一把梭失败时
          # **前面已经传上去的资产会留在那儿**，重跑就撞上
          # `ReleaseAsset.name already exists`（HTTP 422）—— 实测就卡死在这里，
          # 结果 Release 只带了一个 SHA256SUMS.txt。
          #
          # 逐个传 + `--clobber` + 重试 + 传完校验，才是**可重跑**的：
          # 任何一步失败重跑都能接着走，而不会卡在"名字已存在"。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # 远端可能只是这一下没连上，所以建之前再确认一次；真建好了
            # 后面 upload 也会 --clobber 覆盖。
            gh release create "$TAG" \
              --title "XrayTun ${TAG}" \
              --notes-file NOTES.md \
              --verify-tag || echo "create 返回非 0（可能已存在），继续逐个上传"
          fi

          for f in dist/*; do
            name="$(basename "$f")"
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "上传 $name 第 $attempt 次失败，$((attempt * 5))s 后重试" >&2
              sleep $((attempt * 5))
            done
            if [ "$ok" -ne 1 ]; then
              echo "资产 $name 重试多次仍失败" >&2
              exit 1
            fi
          done

          # 传完核对：别出现"步骤绿了但资产不全"（上面那个 422 就是这么来的）。
          listed="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$listed"
          for f in dist/*; do
            name="$(basename "$f")"
            printf '%s\n' "$listed" | grep -qx "$name" \
              || { echo "Release 里没有 $name" >&2; exit 1; }
          done
          echo "资产齐全"

          # **确保它是"已发布"而不是草稿。**
          #
          # `gh release create` 在某些失败路径下会留下一个 **draft**，而
          # **匿名用户看不到草稿** —— 于是 check_app 会认为最新版还是上一个。
          # 症状极具迷惑性：CI 全绿、资产齐全、`gh release view` 也正常
          # （它带认证），但**客户端永远收不到这个版本**。
          # 实测 v0.7.7 就是这样：Release 是草稿，客户端报"最新版 0.7.6"。
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json isDraft --jq 'if .isDraft then error("仍是草稿") else "已发布" end'
