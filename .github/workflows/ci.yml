name: CI

# 这个项目的代码**只能在 macOS 上跑**：utun 走 PF_SYSTEM 内核控制接口、
# 路由是 `route(8)`、对端校验用 Security.framework，都不是可移植代码。
# 所以没有 Linux job —— 在 ubuntu 上能过的只有纯解析部分，那覆盖不了
# 真正会坏的地方，反而会给人一种「CI 绿了就没问题」的错觉。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读仓库：`scripts/check.sh` 只跑构建/lint/测试，不写回仓库、不改 issue/PR。
# 不显式声明就是「默认权限」，比这里需要的宽 —— 另外三个 workflow 都钉了最小权限。
permissions:
  contents: read

# 同一个 ref 同时只跑一个 check。
#   * PR：取消被后一次推送取代的旧 run（常见做法，省 runner 的同时不给误导性的红）；
#   * main push：**不取消**（`cancel-in-progress` 只在 pull_request 时为真）——
#     与 pages.yml / cloudflare-pages.yml 的取舍一致：已发生的构建记录要留得住。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # 依赖缓存放进工作区，和 scripts/dev.sh 的约定一致。
  CARGO_HOME: ${{ github.workspace }}/.cargo
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
  # 必须显式给：`scripts/check.sh` 的默认值是 `$ROOT/../.npm-cache`（本地
  # 习惯把缓存放在仓库隔壁），而 actions/cache 缓存的是工作区**里面**的
  # `.npm-cache`。不给这一行，缓存会永远写不进也读不到。
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  check:
    name: 构建 / lint / 测试
    runs-on: macos-14
    # 默认 360 分钟；一次 check 实测 3–8 分钟。给个上限，避免卡死的 run 白烧 runner。
    timeout-minutes: 30
    steps:
      # `fetch-depth: 0` 是**必需的**，不是优化：`scripts/check.sh` 现在会跑
      # `scripts/bump-release.py self-test`，而后者的夹具是**真实历史树**
      # （`git archive <commit>`）。默认的 `--depth 1` 浅克隆取不到那个提交，
      # 自测会以退出码 75（环境问题）明确失败。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV

      - name: 缓存 cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            .cargo/git
            .cargo-target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      # 全部检查都在 `scripts/check.sh` 里，CI 只负责调用它。
      #
      # 为什么不再把步骤摊在这里：这个文件曾经写成
      # `npm --prefix apps/ui exec tsc -- --noEmit` —— 少了个 `-p`，
      # 于是 tsc 在仓库根找不到 tsconfig.json、打印帮助并退出 1。
      # 那条 CI 红了三个提交都没人发现，因为**本地没有任何一条命令会踩到它**。
      # 现在本地和 CI 跑的是同一个脚本，不可能再漂移：
      #
      #     ./scripts/check.sh
      #
      - name: 构建 / lint / 测试（scripts/check.sh，与本地完全一致）
        run: ./scripts/check.sh
