# xraytun-next 发布流水线（Linux x86_64 核心）
#
# 为什么单独一条工作流，而不是塞进 release.yml：
#   release.yml 的产物是 macOS 应用（dmg/zip + 公证 + 站点），跑在 macos-14 上，动辄几十分钟；
#   这条分支现在交付的是 linux-x86_64 的核心二进制（daemon + CLI），跑 ubuntu 几分钟就好。
#   两条产线混在一起会互相阻塞，也会让「哪一步慢了」难判断。
#
# 二进制不进 git：根 .gitignore 一贯把大体积第三方产物挡在外面，
# 产物走 Release 资产、源码走 git 历史，两边由 sha256 对上。
#
# 触发：
#   推 tag xraytun-next-v* → 构建 + 测试 + 发 Release（预发布）
#   手动 workflow_dispatch  → 同上（tag 用工作区版本号拼）
#
# 顺序就是判据顺序：钉工具链 → guard → clippy → 测试（含真 xray 端到端）→ 构建 → 打包 → 发布。
name: xraytun-next build & release

on:
  push:
    tags:
      - 'xraytun-next-v*'
    # 分支推送 = **只构建、只跑测试、只上传工作流产物**，不发 Release。
    # 这样迭代不污染线上版本；发版仍然只由 tag 决定（见各 job 的 `if: github.ref_type == 'tag'`）。
    branches:
      - xraytun-next-v1
    paths:
      - 'xraytun-next/**'
      - '.github/workflows/xraytun-next-*.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 钉死工具链：本机验证用的是 1.98.1，CI 不该用另一个版本得出另一个结论
  RUSTUP_TOOLCHAIN: '1.98.1'
  XT_XRAY_BIN: /tmp/xray/xray
  XRAY_VERSION: v26.3.27

jobs:
  # 先 lint 再烧 runner：workflow 表达式写错时 GitHub 会判整个文件非法，
  # 表现是 run 里 **0 个 job**、没有任何日志 —— 只能靠网页上看 "Invalid workflow file"。
  # 2026-10-01 就这么白烧了两次运行（`secrets` 出现在步骤级 if 里）。
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: actionlint（抓表达式 / 上下文可用性错误）
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          # 只查**本**流水线：目标是把「GitHub 会拒绝解析」的错（表达式、上下文
          # 可用性、job 图）挡在便宜的 ubuntu 上。仓库里 release.yml /
          # cloudflare-pages.yml 还有既有的 shellcheck info 级提示，与本闸门无关，
          # 不该因为它们红了就拦住发布，所以这里同时关掉 shellcheck。
          /tmp/actionlint -color -shellcheck= .github/workflows/xraytun-next-release.yml

  linux-core:
    needs: workflow-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust 1.98.1（含 clippy）
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          cargo --version && cargo clippy --version

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xraytun-next/target
          key: xt-next-linux-${{ hashFiles('xraytun-next/Cargo.lock', 'xraytun-next/rust-toolchain.toml') }}
          restore-keys: xt-next-linux-

      - name: 取真 xray（端到端测试需要，不跳测试）
        run: |
          curl -fL --retry 3 -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          mkdir -p /tmp/xray
          unzip -o /tmp/xray.zip -d /tmp/xray >/dev/null
          "$XT_XRAY_BIN" version

      - name: 不变量守卫（guard.sh）
        working-directory: xraytun-next
        run: bash scripts/guard.sh

      - name: clippy
        working-directory: xraytun-next
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试（含真 xray 端到端）
        working-directory: xraytun-next
        run: cargo test --workspace

      - name: 构建 release 二进制
        working-directory: xraytun-next
        run: cargo build --release -p xt-daemon -p xt-cli

      - name: 打包 + 校验和
        working-directory: xraytun-next
        run: |
          set -euo pipefail
          VERSION="$(awk '/^\[workspace.package\]/{f=1;next} f&&/^version/{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          NAME="xraytun-next-${VERSION}-linux-x86_64"
          mkdir -p "dist/$NAME/bin"
          cp target/release/xt-daemon target/release/xt-cli "dist/$NAME/bin/"
          cp packaging/INSTALL-linux.md "dist/$NAME/INSTALL.md"
          cp ../LICENSE "dist/$NAME/LICENSE"
          tar czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > SHA256SUMS.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "--- 本次产物 ---"
          cat "dist/SHA256SUMS.txt"
          sha256sum target/release/xt-daemon target/release/xt-cli

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: xraytun-next-linux-x86_64
          path: |
            xraytun-next/dist/*.tar.gz
            xraytun-next/dist/SHA256SUMS.txt

      - name: 发布 Release（仅 tag；已存在则只补资产）
        if: github.ref_type == 'tag'
        working-directory: xraytun-next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="xraytun-next-v${VERSION}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "xraytun-next v${VERSION}（Linux x86_64 核心 · proxy 模式）" \
              --prerelease \
              --notes-file docs/release-notes/v1.1.5.md \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          echo "--- 线上资产 ---"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

  # ---------------------------------------------------------------------------
  # macOS 核心：本机（Linux）**根本没法编译也验证不了** macOS 产物，
  # 所以这一段的唯一价值就是"在真 mac 上真的构建、真的跑测试"。
  # 它与 linux-core 是两条并行产线（互不阻塞），产物是 universal（arm64 + x86_64）。
  # ---------------------------------------------------------------------------
  macos-core:
    needs: workflow-lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust 1.98.1 + 两个 mac target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup target add --toolchain 1.98.1 aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xraytun-next/target
          key: xt-next-macos-${{ hashFiles('xraytun-next/Cargo.lock', 'xraytun-next/rust-toolchain.toml') }}
          restore-keys: xt-next-macos-

      - name: 取真 xray（两个架构 lipo 合成 universal）
        run: |
          set -euo pipefail
          mkdir -p /tmp/xa /tmp/xb /tmp/xray
          curl -fL --retry 3 -o /tmp/xa.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-arm64-v8a.zip"
          curl -fL --retry 3 -o /tmp/xb.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-64.zip"
          unzip -oq /tmp/xa.zip -d /tmp/xa
          unzip -oq /tmp/xb.zip -d /tmp/xb
          lipo -create /tmp/xa/xray /tmp/xb/xray -output /tmp/xray/xray
          chmod +x /tmp/xray/xray
          echo "核心架构：$(lipo -archs /tmp/xray/xray)"
          /tmp/xray/xray version

      - name: 不变量守卫（guard.sh）
        working-directory: xraytun-next
        run: bash scripts/guard.sh

      - name: clippy
        working-directory: xraytun-next
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试（含真 xray 端到端）—— 在真实 macOS 上跑
        working-directory: xraytun-next
        run: cargo test --workspace

      - name: 构建两个架构并 lipo 成 universal
        working-directory: xraytun-next
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p xt-daemon -p xt-cli
          done
          mkdir -p dist/universal/bin
          for b in xt-daemon xt-cli; do
            lipo -create "target/aarch64-apple-darwin/release/$b" \
                        "target/x86_64-apple-darwin/release/$b" \
                        -output "dist/universal/bin/$b"
          done
          file dist/universal/bin/*
          for b in xt-daemon xt-cli; do echo "$b 架构：$(lipo -archs "dist/universal/bin/$b")"; done

      - name: 冒烟（真的能起来、真的能说话）
        working-directory: xraytun-next
        run: |
          set -euo pipefail
          ./dist/universal/bin/xt-daemon --socket /tmp/xt.sock --state-dir /tmp/xt-state \
            --xray /tmp/xray/xray > /tmp/xt-daemon.log 2>&1 &
          DAEMON=$!
          trap 'kill $DAEMON 2>/dev/null || true' EXIT
          # 测试夹具的等待（产品本身没有 sleep）
          for _ in $(seq 1 100); do [ -S /tmp/xt.sock ] && break; sleep 0.1; done
          [ -S /tmp/xt.sock ] || { echo "daemon socket 没出现"; cat /tmp/xt-daemon.log; exit 1; }
          ./dist/universal/bin/xt-cli --socket /tmp/xt.sock hello
          ./dist/universal/bin/xt-cli --socket /tmp/xt.sock --json status
          kill $DAEMON; wait $DAEMON 2>/dev/null || true

      - name: 打包 + 校验和
        working-directory: xraytun-next
        run: |
          set -euo pipefail
          VERSION="$(awk '/^\[workspace.package\]/{f=1;next} f&&/^version/{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          NAME="xraytun-next-${VERSION}-macos-universal"
          mkdir -p dist
          cp -R dist/universal "dist/$NAME"
          cp packaging/INSTALL-macos.md "dist/$NAME/INSTALL.md"
          cp ../LICENSE "dist/$NAME/LICENSE"
          tar czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > SHA256SUMS-macos.txt)
          cat "dist/SHA256SUMS-macos.txt"

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: xraytun-next-macos-universal
          path: |
            xraytun-next/dist/*.tar.gz
            xraytun-next/dist/SHA256SUMS-macos.txt

      - name: 发布 Release（仅 tag；已存在则只补资产）
        if: github.ref_type == 'tag'
        working-directory: xraytun-next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "xraytun-next（Linux + macOS 核心 · proxy 模式）" \
              --prerelease \
              --notes-file docs/release-notes/v1.1.5.md \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS-macos.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

  # 桌面 .app（Tauri 2 薄壳）+ dmg。S4：只在 macOS 上能构建；tauri build + lipo + codesign。
  # 首次接通可能需要 CI 迭代（tauri CLI 调用、codesign 自签、dmg 布局）。
  macos-app:
    needs: workflow-lint
    runs-on: macos-14
    env:
      # secrets **不能**出现在步骤级 if 里：GitHub 的上下文白名单不允许，
      # 会直接判整个 workflow 非法（run 里 0 个 job，报 Unrecognized named-value）。
      # 这里在 job 级把它取出来变成普通变量，步骤里再通过 env 引用。
      XT_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust + 两个 mac target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup target add --toolchain 1.98.1 aarch64-apple-darwin x86_64-apple-darwin

      - name: 缓存 cargo + npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xraytun-next/target
            ~/.npm
          key: xt-next-app-${{ hashFiles('xraytun-next/Cargo.lock', 'xraytun-next/apps/ui/package-lock.json') }}
          restore-keys: xt-next-app-

      - name: 取真 xray（两架构 lipo 合成 universal）放入 binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/xa /tmp/xb xraytun-next/apps/desktop/binaries
          curl -fL --retry 3 -o /tmp/xa.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-arm64-v8a.zip"
          curl -fL --retry 3 -o /tmp/xb.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-64.zip"
          unzip -oq /tmp/xa.zip -d /tmp/xa
          unzip -oq /tmp/xb.zip -d /tmp/xb
          lipo -create /tmp/xa/xray /tmp/xb/xray -output xraytun-next/apps/desktop/binaries/xray
          chmod +x xraytun-next/apps/desktop/binaries/xray

      - name: 构建 universal 核心（xt-daemon + xt-helperd）
        working-directory: xraytun-next
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p xt-daemon -p xt-helperd
          done
          for b in xt-daemon xt-helperd; do
            lipo -create "target/aarch64-apple-darwin/release/$b" \
                        "target/x86_64-apple-darwin/release/$b" \
                        -output "apps/desktop/binaries/$b"
          done

      - name: 装 tauri CLI + 构建 UI
        working-directory: xraytun-next/apps/ui
        run: npm ci && npm install --no-save @tauri-apps/cli@^2 && npm run build

      - name: 清理 FinderInfo xattr（codesign --strict 会拒带该 xattr 的二进制）
        run: xattr -cr xraytun-next/apps/desktop/binaries/ 2>/dev/null || true

      # 只打 `.app`（`--bundles app`）。dmg 交给后面的 hdiutil 步骤，理由是顺序问题：
      # 签名必须在打包**之前**完成，否则 dmg 里装的是未签名的 app（而 CI 验的是 .app）。
      - name: tauri build（universal，只出 .app；有 Apple 凭据则 Developer ID 签名 + 公证）
        id: tauri_build
        working-directory: xraytun-next/apps/desktop
        env:
          # S5：这些 secrets 未配置时为空，tauri 退化为不签名（由下一步 ad-hoc 兜底）。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # secrets 未配置时这些变量是**空串**而不是缺失。tauri 可能把「设了但为空」
          # 当成一个签名身份，那样 ad-hoc 兜底就永远等不到。空就 unset，
          # 让这一步与「从来没配过 secrets」完全等价。
          for v in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          ../ui/node_modules/.bin/tauri build --target universal-apple-darwin --bundles app

      - name: 断言 .app 真的产出了（后面每一步都以它为输入）
        run: |
          set -euo pipefail
          BIN="xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle/macos/XrayTun.app/Contents/MacOS/xraytun-desktop"
          if [ ! -x "$BIN" ]; then
            echo "::error::没有产出可执行的 .app —— 这多半是编译失败，去看上一步 tauri build 的输出"
            exit 1
          fi
          echo "✓ .app 已产出"

      - name: ad-hoc 签名（无 Apple 凭据时的降级；有凭据则已由 tauri 签好）
        if: env.XT_APPLE_SIGNING_IDENTITY == ''
        run: |
          APP="xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle/macos/XrayTun.app"
          # 先签内嵌二进制，再签 .app（macOS 嵌套代码签名顺序；--deep 已弃用不可靠）
          for b in Contents/Resources/xray Contents/Resources/xt-daemon Contents/Resources/xt-helperd; do
            codesign --force --sign - "$APP/$b"
          done
          codesign --force --sign - "$APP"

      - name: 校验 universal + codesign --strict
        run: |
          set -euo pipefail
          D="xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle"
          APP="$D/macos/XrayTun.app"
          for f in Contents/MacOS/xraytun-desktop Contents/Resources/xt-daemon \
                   Contents/Resources/xt-helperd Contents/Resources/xray; do
            [ -e "$APP/$f" ] || { echo "缺少 $f" >&2; exit 1; }
            archs="$(lipo -archs "$APP/$f")"
            echo "$f: $archs"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "$f 不是 universal（$archs）" >&2; exit 1 ;;
            esac
          done
          codesign --verify --strict --verbose=1 "$APP"

      # 打包出来的 .app 到底能不能起来 —— 编译通过、codesign 通过都不回答这个问题。
      #
      # 跑两轮，各截一张图：
      #   第 1 轮 默认启动（落在「状态」页）；
      #   第 2 轮 用 `XT_INITIAL_PAGE=settings` 注入初始页，直接落在「设置」页。
      # 为什么专门要设置页那张：真机上「daemon 版本 / pid 未知」与「设置未加载，无法编辑」
      # 只出现在设置页（`apps/ui/src/pages/Settings.tsx`），而 CI 里**点不动**界面
      # （AppleScript 够不到 WebView 里的按钮，实测 -1728），只能靠注入初始页。
      #
      # 硬判据两条，失败即拦发布：壳进程 30 秒后仍存活、xt-daemon 确实在跑。
      # 图与日志是尽力而为（screencapture 需要屏幕录制 TCC），只当证据留档。
      - name: 打包 signed .app 为 zip（DMG 偶发失败时的保底交付）
        run: |
          set -euo pipefail
          B="xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle"
          V="$(sed -n 's/^version = "\(.*\)"/\1/p' xraytun-next/Cargo.toml | head -1)"
          # 用 ditto 而不是 zip -r：.app 是 bundle，ditto 保留资源分叉与符号链接，
          # zip -r 会在 .app 上丢东西。--keepParent 让解压出来直接就是 XrayTun.app。
          ditto -c -k --sequesterRsrc --keepParent \
            "$B/macos/XrayTun.app" "$B/macos/XrayTun_${V}_universal.app.zip"
          ls -l "$B/macos/"

      # 腾空间。runner 的 SSD 只有约 14 GB，而我们在这里堆了：两个架构的 target/、
      # 合并后的 universal target/、node_modules、bundle 里的 universal 二进制……
      # 证据：我用 hdiutil 从已签名 app 重打 dmg 时两次都死在
      # `hdiutil: create failed - No space left on device`（挂载出来的镜像装不下内容），
      # 而 tauri 自己的 dmg 也在 tag 运行里失败并留下 diskimages-help 孤儿进程。
      # 所以先把**已经用不到**的中间产物删掉，再打 dmg。
      - name: 腾出磁盘（打 dmg 前）
        run: |
          set -x
          df -h /
          du -sh xraytun-next/target 2>/dev/null || true
          # 注意不要删 target/universal-apple-darwin/release/bundle —— .app 在那里
          rm -rf xraytun-next/target/aarch64-apple-darwin \
                 xraytun-next/target/x86_64-apple-darwin \
                 xraytun-next/target/universal-apple-darwin/release/deps \
                 xraytun-next/target/universal-apple-darwin/release/build \
                 xraytun-next/target/universal-apple-darwin/release/.fingerprint \
                 xraytun-next/target/universal-apple-darwin/release/incremental \
                 xraytun-next/apps/desktop/binaries
          df -h /

      # 从**已签名**的 .app 打 dmg，并把它挂起来验里面的 app。
      # 为什么必须挂起来验：用户下载的是 dmg。只验 bundle/macos 里的 .app 等于「验 A 发 B」。
      # 为什么容忍失败：dmg 是便利交付，zip 才是保底；这步失败会红着留在日志里，不被吞掉。
      - name: 打 DMG（从已签名 .app；hdiutil，不用 Finder 自动化）
        continue-on-error: true
        run: |
          set -euo pipefail
          SHOT="$PWD/xraytun-next/shot"
          mkdir -p "$SHOT"
          # 完整输出同时进 artifact：GitHub 的 job 日志接口会截断，上次连一行错误都没拿到。
          exec > >(tee "$SHOT/dmg-step.log") 2>&1
          set -x

          B="xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle"
          V="$(sed -n 's/^version = "\(.*\)"/\1/p' xraytun-next/Cargo.toml | head -1)"
          echo "version=$V"
          STAGE="$(mktemp -d)"
          # ditto 而不是 cp -R：.app 是 bundle，ditto 保留扩展属性与符号链接，签名不会被复制破坏
          ditto "$B/macos/XrayTun.app" "$STAGE/XrayTun.app"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p "$B/dmg"
          OUT="$B/dmg/XrayTun_${V}_universal.dmg"
          TMP_RW="$B/dmg/.XrayTun_rw.dmg"
          rm -f "$OUT" "$TMP_RW"
          df -h /
          # 参数照抄 tauri bundle_dmg.sh：-fs HFS+ -fsargs 控制块大小，避免镜像尺寸估小
          hdiutil create -volname "XrayTun" -srcfolder "$STAGE" -fs HFS+ \
            -fsargs "-c c=64,a=16,e=16" -ov -format UDRW "$TMP_RW"
          hdiutil convert "$TMP_RW" -format UDZO -imagekey zlib-level=9 -o "$OUT"
          rm -f "$TMP_RW"; rm -rf "$STAGE"

          echo "=== 挂起来验 dmg 里的 app（我们发什么就验什么）==="
          MP="$(mktemp -d)"
          hdiutil attach -nobrowse -quiet -mountpoint "$MP" "$OUT"
          codesign --verify --strict --verbose=1 "$MP/XrayTun.app"
          lipo -archs "$MP/XrayTun.app/Contents/MacOS/xraytun-desktop"
          hdiutil detach -quiet "$MP"; rm -rf "$MP"
          ls -l "$B/dmg/"

      - name: 启动 app 冒烟 + 两页截图（进程存活与 daemon 是硬判据，失败拦发布）
        run: |
          set -x
          APP="xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle/macos/XrayTun.app"
          SHOT="$PWD/xraytun-next/shot"
          BIN="$APP/Contents/MacOS/xraytun-desktop"
          # 只建不删：`dmg-step.log` 是上一步留在这儿的，删掉就等于又回到「没有证据」。
          mkdir -p "$SHOT"

          # 直接跑壳的二进制而不是 `open`：`open` 会把 stderr 丢进系统日志，而壳的诊断
          # 信息（socket 路径、就绪握手、桥的错误）全在 stderr 上。
          echo "=== 第 1 轮：默认启动（状态页）==="
          "$BIN" >"$SHOT/dashboard.out" 2>"$SHOT/dashboard.err" &
          PID1=$!
          sleep 30
          screencapture -x "$SHOT/dashboard.png" && echo "dashboard.png 成功" || echo "dashboard.png 失败（多半是屏幕录制 TCC）"
          echo "--- 壳 stderr（第 1 轮）---"; tail -20 "$SHOT/dashboard.err" || true
          ps -p "$PID1" >/dev/null || { echo "::error::默认启动 30 秒内就退出了（见上面 stderr）"; exit 1; }
          kill "$PID1" 2>/dev/null || true
          sleep 3

          echo "=== 第 2 轮：注入初始页 settings ==="
          XT_INITIAL_PAGE=settings "$BIN" >"$SHOT/settings.out" 2>"$SHOT/settings.err" &
          PID2=$!
          sleep 30
          screencapture -x "$SHOT/settings.png" && echo "settings.png 成功" || echo "settings.png 失败"
          echo "--- 壳 stderr（第 2 轮）---"; tail -20 "$SHOT/settings.err" || true

          echo "=== 尽力而为：daemon 日志 ==="
          tail -40 "$HOME/Library/Logs/XrayTun/xt-daemon.log" 2>/dev/null || echo "没有 daemon 日志文件"
          ls -l "$SHOT"

          echo "=== 硬判据 1：壳进程必须还活着 ==="
          ps -p "$PID2" >/dev/null || { echo "::error::打包出来的 .app 30 秒内退出了（见上面 stderr）"; exit 1; }
          echo "壳进程存活"

          echo "=== 硬判据 2：xt-daemon 必须真的在跑 ==="
          pgrep -x xt-daemon >/dev/null || { echo "::error::壳起来了但 xt-daemon 没在跑（见上面 stderr）"; exit 1; }
          echo "xt-daemon 在跑"

      - name: 上传 dmg/app 产物
        uses: actions/upload-artifact@v4
        with:
          name: xraytun-next-macos-app
          path: |
            xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle/macos/*.app
            xraytun-next/apps/desktop/target/universal-apple-darwin/release/bundle/macos/*.app.zip
            xraytun-next/shot/**

      - name: 发布 Release（仅 tag；已存在则只补资产）
        if: github.ref_type == 'tag'
        working-directory: xraytun-next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "xraytun-next v1.1.5（macOS 应用 · TUN 模式）" \
              --prerelease \
              --notes-file docs/release-notes/v1.1.5.md \
              --target "$GITHUB_SHA"
          fi
          # DMG 与 .app.zip 各自独立、存在才传：「DMG 打包失败」不该等于
          # 「这次发布没有 macOS 应用」。
          B="apps/desktop/target/universal-apple-darwin/release/bundle"
          for f in "$B"/dmg/*.dmg "$B"/macos/*.app.zip; do
            if [ -e "$f" ]; then
              gh release upload "$TAG" "$f" --clobber
            else
              echo "跳过（不存在）：$f"
            fi
          done
