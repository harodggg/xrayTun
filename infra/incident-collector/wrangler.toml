#:schema node_modules/wrangler/config-schema.json
# XrayTun 现场包接收端点（task-114）
#
# 部署（由 lead 用**临时授权**执行；token 绝不进仓库）：
#   CF_ACCOUNT_ID=<account-id> CF_API_TOKEN="$(cat ~/.cf-incident-token)" \
#     npx wrangler deploy --config infra/incident-collector/wrangler.toml
#
# ⚠️ 只会创建/更新 **xraytun-incident-collector**（Worker）与 **xraytun-incidents**（R2 桶）。
#    账号里已有的其它 Worker（eth-arb-scout / vless / …）与别的桶（mymutlicloud）**一律不动**：
#    本目录里没有任何 delete/prune 命令；若你的输出里出现别的名字，说明命令写错了 —— 停下来。
#
# 路由为什么用 `xraytun.top/api/incident/*` 而不是 `*.workers.dev`：
#   用户的机器在中国大陆，`*.workers.dev` 经常不可达；`xraytun.top` 已实测可达。
#   同 zone 上的 Workers Route **优先于 Pages**，因此不需要新 DNS。
#   若部署时报「路由需要 Zone 权限 / hostname 要有 DNS 记录」，**停手报 lead**，
#   备选是 `incident.xraytun.top`（同 zone、走 CF 代理）。
name = "xraytun-incident-collector"
main = "src/worker.mjs"
compatibility_date = "2026-09-22"

# 同 zone 路由（Workers Route 优先于 Pages）
#
# ⚠️ **这个块必须放在文件最前面（任何 `[table]` / `[[array-of-table]]` 之前）。**
# TOML 的表一直生效到下一个表头：`routes` 只要落在任何表头之后，就会被当成那张表里的
# **未知字段**或普通变量 —— 两种表现都是同一个后果：**一条路由都不会注册**，
# 部署看起来成功，而 `POST https://xraytun.top/api/incident` 返回 **405**（请求落到了 Pages）。
# 2026-09-23 的真实事故：先被当成 `vars.routes` 环境变量，改成放前面后又落进 `[[r2_buckets]]`
# （wrangler 只给一句 `Unexpected fields found in r2_buckets[0] field: "routes"`）。
# 部署后**必须**用 `GET /zones/<zone>/workers/routes` 或直接 `curl -X POST` 复核，别看部署日志说成功。
#
# ⚠️ 两条 pattern 都要：`/api/incident/*` **不匹配** `/api/incident` 本身（少了尾部斜杠就是另一种路径），
#    而 worker 的上传入口恰好是「`POST <base>` 且 rest 为空」⇒ 只写带 `/*` 的那条，
#    `POST https://xraytun.top/api/incident` 会落到 Pages，返回 **405**（2026-09-23 的第二次事故）。
routes = [
  { pattern = "xraytun.top/api/incident", zone_name = "xraytun.top" },
  { pattern = "xraytun.top/api/incident/*", zone_name = "xraytun.top" }
]

# R2：**只存 zip 与 manifest**（不含 IP、不含账号/订阅信息 —— 见 PRIVACY.md）
[[r2_buckets]]
binding = "INCIDENT_BUCKET"
bucket_name = "xraytun-incidents"

# 保留 30 天：这里的 RETENTION_DAYS 是 worker 侧**惰性过期**判据；
# R2 侧的 lifecycle 规则要单独设（见 README「R2 lifecycle」；命令也写在 README 里）。
[vars]
BASE_PATH = "/api/incident"
MAX_BYTES = "10485760"          # 10 MiB
RETENTION_DAYS = "30"
RATE_LIMIT_MAX = "5"            # 每窗口最多 5 次
RATE_LIMIT_WINDOW_SECONDS = "3600"
ALLOWED_TYPES = "application/zip,application/octet-stream,application/x-zip-compressed"

# ⚠️ INCIDENT_TOKEN 是**秘密**，不放 [vars]：
#     npx wrangler secret put INCIDENT_TOKEN --config infra/incident-collector/wrangler.toml
#
[observability]
enabled = false   # 不采集请求日志（日志里可能有客户端信息）；排查用 curl 即可
